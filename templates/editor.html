<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑文档 - Iron_Grey_的Blog系统</title>
    
    <!-- Vditor CSS -->
    <link href="https://cdn.jsdelivr.net/npm/vditor@3.9.8/dist/index.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
        }
        
        .toolbar {
            background: #fff;
            border-bottom: 2px solid #000;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .btn {
            background: #000;
            color: #fff;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }
        
        .btn:hover {
            background: #333;
        }
        
        .editor-container {
            height: calc(100vh - 60px);
            margin: 0;
            padding: 0;
        }
        
        #vditor {
            height: 100%;
            border: none;
            border-radius: 0;
        }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
        }

        .toast {
            background: #fff;
            border: 2px solid #000;
            padding: 15px 20px;
            margin-bottom: 10px;
            min-width: 300px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toast.error {
            border-color: #d32f2f;
            background: #fff;
        }

        .toast.success {
            border-color: #388e3c;
            background: #fff;
        }

        .toast.info {
            border-color: #1976d2;
            background: #fff;
        }

        .toast-close {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #666;
            margin-left: 10px;
        }

        .toast-close:hover {
            color: #000;
        }
        
        /* 隐藏所有滚动条 */
        ::-webkit-scrollbar {
            display: none;
        }
        
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        /* 文字选中颜色 - 黑白风格 */
        ::selection {
            background-color: #000;
            color: #fff;
        }
        
        ::-moz-selection {
            background-color: #000;
            color: #fff;
        }
        
        /* 焦点控件特效颜色 - 黑白风格 */
        button:focus {
            outline: 2px solid #000;
            outline-offset: 1px;
        }
        
        /* 按钮激活颜色 - 黑白风格 */
        .btn:active {
            background-color: #333 !important;
            color: #fff !important;
            border-color: #000 !important;
        }
        
        /* Vditor 自定义样式 */
        .vditor-toolbar {
            border-bottom: 1px solid #eaecef;
        }
        
        .vditor-content {
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div>
            <button class="btn" onclick="saveFile()">保存</button>
            <button class="btn" onclick="window.close()">关闭</button>
        </div>
        <div id="fileInfo"></div>
    </div>

    <div class="editor-container">
        <div id="vditor"></div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <!-- Vditor JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/vditor@3.9.8/dist/index.min.js"></script>

    <script>
        let vditor;
        let autoSaveTimer = null;
        let lastSavedContent = '';
        
        // 获取URL参数
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return Object.fromEntries(params.entries());
        }

        // 基于 base.html 的 toast 弹出函数（右上角浮动）
        function showAlert(message, type = 'info') {
            let container = document.getElementById('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const messageSpan = document.createElement('span');
            messageSpan.textContent = message;

            const closeBtn = document.createElement('button');
            closeBtn.className = 'toast-close';
            closeBtn.innerHTML = '×';
            closeBtn.onclick = () => {
                toast.remove();
            };

            toast.appendChild(messageSpan);
            toast.appendChild(closeBtn);
            container.appendChild(toast);

            // 自动移除
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.remove();
                }
            }, 5000);
        }

        // 加载文件内容
        function loadFile() {
            const params = getUrlParams();
            const filePath = params.file;

            if (!filePath) {
                showAlert('未指定文件', 'error');
                return;
            }

            document.getElementById('fileInfo').textContent = `编辑: ${filePath}`;

            fetch(`/api/file/${encodeURIComponent(filePath)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        showAlert(data.error, 'error');
                    } else {
                        // 设置上次保存的内容
                        lastSavedContent = data.content;
                        // 初始化Vditor编辑器
                        initVditor(data.content);
                    }
                })
                .catch(error => {
                    showAlert('加载失败: ' + error, 'error');
                });
        }

        // 初始化Vditor编辑器
        function initVditor(content) {
            vditor = new Vditor('vditor', {
                mode: 'wysiwyg',
                value: content || '',
                minHeight: window.innerHeight - 60,
                cache: {
                    enable: false
                },
                upload: {
                    accept: 'image/*,.mp3,.mp4,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar',
                    handler: (files) => {
                        // 文件上传处理
                        showAlert('文件上传功能需要后端支持', 'info');
                        return false;
                    }
                },
                toolbar: [
                    'emoji',
                    'headings',
                    'bold',
                    'italic',
                    'strike',
                    'link',
                    '|',
                    'list',
                    'ordered-list',
                    'check',
                    'outdent',
                    'indent',
                    '|',
                    'quote',
                    'line',
                    'code',
                    'inline-code',
                    'insert-before',
                    'insert-after',
                    '|',
                    'table',
                    '|',
                    'undo',
                    'redo',
                    '|',
                    'fullscreen',
                    'edit-mode',
                    '|',
                    'preview',
                    'outline',
                    'code-theme',
                    'content-theme',
                    'export'
                ],
                preview: {
                    markdown: {
                        toc: true,
                        mark: true,
                        footnotes: true,
                        autoSpace: true
                    },
                    math: {
                        engine: 'KaTeX'
                    },
                    theme: {
                        current: 'light'
                    }
                },
                theme: 'classic',
                icon: 'material',
                placeholder: '开始写作...',
                lang: 'zh_CN',
                input: (value) => {
                    // 内容变化时的回调
                    scheduleAutoSave();
                },
                focus: (value) => {
                    // 获得焦点时的回调
                },
                blur: (value) => {
                    // 失去焦点时的回调
                },
                select: (value) => {
                    // 选中文本时的回调
                }
            });
        }

        // 定时自动保存
        function scheduleAutoSave() {
            if (autoSaveTimer) {
                clearTimeout(autoSaveTimer);
            }
            
            autoSaveTimer = setTimeout(() => {
                const currentContent = vditor ? vditor.getValue() : '';
                if (currentContent !== lastSavedContent) {
                    saveFile(); // 自动保存也显示提示
                }
            }, 30000); // 30秒后自动保存
        }

        // 保存文件
        function saveFile() {
            if (!vditor) return;
            
            const params = getUrlParams();
            const filePath = params.file;
            const content = vditor.getValue();

            fetch(`/api/file/${encodeURIComponent(filePath)}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content: content})
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showAlert(data.error, 'error');
                } else {
                    lastSavedContent = content;
                    showAlert('保存成功', 'success');
                }
            })
            .catch(error => {
                showAlert('保存失败: ' + error, 'error');
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadFile();

            // 当页面不可见（切换标签）时保存一次
            document.addEventListener('visibilitychange', function() {
                if (document.hidden && vditor) {
                    const currentContent = vditor.getValue();
                    if (currentContent !== lastSavedContent) {
                        saveFile(); // 页面隐藏时也显示提示
                    }
                }
            });
            
            // 窗口大小变化时调整编辑器高度
            window.addEventListener('resize', function() {
                if (vditor) {
                    vditor.setMinHeight(window.innerHeight - 60);
                }
            });
        });
    </script>
</body>
</html>
